spring.application.name=cms

# Load local secrets from backend/cms/.env (gitignored; optional if file is absent)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/reports

# Gmail SMTP — credentials must be supplied via environment variables (never commit them)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender uses MAIL_USERNAME; MAIL_FROM in .env is optional and only applies when non-empty
app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=${MAIL_FROM_NAME:KurePulse Clinic}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

app.doctor.username=${DOCTOR_USERNAME}
app.doctor.password=${DOCTOR_PASSWORD}
app.staff.username=${STAFF_USERNAME}
app.staff.password=${STAFF_PASSWORD}
