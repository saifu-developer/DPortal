spring.application.name=cms

# Cloud hosts (Railway, Render, etc.) inject PORT; default 8080 for local runs
server.port=${PORT:8080}

# Load local secrets from backend/cms/.env (gitignored; optional if file is absent)
spring.config.import=optional:file:.env[.properties]

# DB_URL takes precedence; otherwise build JDBC URL from Railway MySQL variables
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:clinic_db}?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}

# Local development defaults; production overrides in application-prod.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/reports}

# Comma-separated exact frontend origins for local dev
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
# Vercel preview/production URL patterns (avoids updating Render on every deploy)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*-saifus-projects-4f77054e.vercel.app,https://d-portal-*.vercel.app}

# Brevo transactional email — credentials must be supplied via environment variables (never commit them)
app.brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:KurePulse Clinic}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

app.doctor.username=${DOCTOR_USERNAME}
app.doctor.password=${DOCTOR_PASSWORD}
app.staff.username=${STAFF_USERNAME}
app.staff.password=${STAFF_PASSWORD}
